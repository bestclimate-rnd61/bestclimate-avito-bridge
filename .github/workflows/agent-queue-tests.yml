name: Agent queue reliability tests
on:
  pull_request:
    paths:
      - 'cloud_task_worker.py'
      - 'business_machine_worker.py'
      - 'business_machine_adapter.py'
      - 'business_machine_live.py'
      - 'business_machine_products.py'
      - 'app.py'
      - 'Dockerfile.business-machine'
      - 'BUSINESS_MACHINE.md'
      - 'agent_queue_api.py'
      - 'avito_draft_store.py'
      - 'avito_xml_qa.py'
      - 'validate_feed_xml.py'
      - 'tests/**'
      - '.github/workflows/agent-queue-tests.yml'
  workflow_dispatch:
jobs:
  queue-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run queue and draft safety tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
