name: Agent queue reliability tests
on:
  pull_request:
    paths:
      - 'cloud_task_worker.py'
      - 'agent_queue_api.py'
      - 'avito_draft_store.py'
      - 'tests/**'
      - '.github/workflows/agent-queue-tests.yml'
  workflow_dispatch:
jobs:
  queue-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run queue reliability tests
        run: python -m unittest discover -s tests -p 'test_agent_queue_reliability.py' -v
