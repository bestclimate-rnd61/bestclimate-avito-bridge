name: Avito2 Readonly Inbox CI
on:
  pull_request:
    paths:
      - 'avito2_adapter/**'
      - '.github/workflows/avito2-inbox-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test avito2_adapter/inbox.test.js
